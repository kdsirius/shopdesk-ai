<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopDesk AI（商答台） · 服务状态</title>
    <style>
        :root { color-scheme: light; font: 16px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif; color: #202c3a; background: #fafbfd; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; background: radial-gradient(ellipse 44rem 25rem at 50% 2rem, #e5f0fc, transparent 100%); }
        header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px 20px; padding: 12px clamp(16px, 4vw, 48px); border-bottom: 1px solid #e2eaf3; background: #fafbfdcc; }
        a { color: inherit; text-decoration: none; }
        .brand { font-weight: 750; letter-spacing: -.02em; }
        .brand span { color: #52677b; margin-inline-start: 8px; font-size: .88rem; font-weight: 400; }
        nav { display: flex; gap: 4px; }
        nav a { padding: 8px 12px; border-radius: 999px; font-size: .88rem; }
        nav a:hover { background: #e5effa; color: #21476e; }
        main { width: min(100% - 32px, 760px); margin: clamp(48px, 16vh, 140px) auto 32px; text-align: center; }
        h1 { color: #233548; margin: .3rem 0; font-size: clamp(1.85rem, 4vw, 2.85rem); font-weight: 550; }
        p { color: #52677b; }
        .primary, button { display: inline-block; border: 1px solid #d9e4f0; border-radius: 999px; padding: 10px 18px; font: inherit; cursor: pointer; }
        .primary { background: #224565; color: #fff; }
        .primary:hover { background: #17354f; }
        button { color: #224565; background: #fff; }
        button:hover:not(:disabled) { background: #e5effa; }
        button:disabled { opacity: .6; cursor: default; }
        :focus-visible { outline: 2px solid #346faf; outline-offset: 3px; }
        #health-result { display: table; margin: 14px auto 0; padding: 5px 12px; border-radius: 999px; background: #e5effa; color: #21476e; font-size: .88rem; }
        #health-result:empty { display: none; }
        #health-result[data-state='ok'] { background: #e5f3eb; color: #245f49; }
        #health-result[data-state='error'] { background: #faeded; color: #863e3e; }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="/" aria-current="page">ShopDesk AI <span>商答台</span></a>
        <nav aria-label="主导航"><a href="/chat.html">手册问答</a><a href="/import.html">导入手册</a></nav>
    </header>
    <main>
        <h1>用一个问题，找到手册答案</h1>
        <p>导入商品手册后，输入商品型号和问题，即可查看回答与参考配图。</p>
        <a class="primary" href="/chat.html">开始问答</a>
        <button id="check-health" type="button">检查服务</button>
        <p id="health-result" role="status"></p>
    </main>

    <script>
        const button = document.getElementById("check-health");
        const result = document.getElementById("health-result");

        button.addEventListener("click", async () => {
            button.disabled = true;
            result.dataset.state = "checking";
            result.textContent = "检查中…";
            try {
                const response = await fetch("/health", { cache: "no-store", signal: AbortSignal.timeout(8000) });
                if (!response.ok || (await response.json()).ok !== true) throw new Error();
                result.dataset.state = "ok";
                result.textContent = "Web 服务可访问";
            } catch {
                result.dataset.state = "error";
                result.textContent = "检查失败，可重试";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
