<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopDesk AI（商答台） · 导入手册</title>
    <style>
        :root { color-scheme: light; font: 16px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif; color: #202c3a; background: #fafbfd; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; background: radial-gradient(ellipse 44rem 25rem at 50% 2rem, #e5f0fc, transparent 100%); }
        header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px 20px; padding: 12px clamp(16px, 4vw, 48px); border-bottom: 1px solid #e2eaf3; background: #fafbfdcc; }
        a { color: inherit; text-decoration: none; }
        .brand { font-weight: 750; letter-spacing: -.02em; }
        .brand span { color: #52677b; margin-inline-start: 8px; font-size: .88rem; font-weight: 400; }
        nav { display: flex; gap: 4px; }
        nav a { padding: 8px 12px; border-radius: 999px; font-size: .88rem; }
        nav a[aria-current], nav a:hover { background: #e5effa; color: #21476e; }
        main { width: min(100% - 32px, 760px); margin: clamp(32px, 10vh, 88px) auto 32px; }
        h1 { color: #233548; margin: 0; font-size: clamp(1.7rem, 4vw, 2.35rem); font-weight: 550; }
        p { color: #52677b; }
        form { display: grid; justify-items: start; gap: 16px; background: #ffffffdb; border: 1px solid #d9e4f0; border-radius: 20px; padding: clamp(18px, 4vw, 32px); }
        input { display: block; max-width: 100%; margin-top: 8px; font: inherit; }
        button, input::file-selector-button { border: 0; border-radius: 999px; padding: 10px 18px; font: inherit; cursor: pointer; }
        input::file-selector-button { background: #e5effa; color: #21476e; }
        button { background: #224565; color: #fff; }
        button:hover:not(:disabled) { background: #17354f; }
        button:disabled { opacity: .48; cursor: default; }
        :focus-visible { outline: 2px solid #346faf; outline-offset: 3px; }
        #import-result { color: #52677b; white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="/">ShopDesk AI <span>商答台</span></a>
        <nav aria-label="主导航"><a href="/chat.html">手册问答</a><a href="/import.html" aria-current="page">导入手册</a></nav>
    </header>
    <main>
        <h1>导入手册</h1>
        <p>上传商品手册。入库完成后，就可以按商品型号提问。</p>
        <form id="upload-form">
            <label>选择 PDF 或 Markdown 手册 <input name="file" type="file" accept=".md,.pdf" required></label>
            <button type="submit">上传</button>
        </form>
        <pre id="import-result" aria-live="polite">等待上传</pre>
    </main>
    <script>
        const form = document.getElementById("upload-form");
        const button = form.querySelector("button");
        const result = document.getElementById("import-result");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            button.disabled = true;
            result.textContent = "正在上传…";
            try {
                const upload = await fetch("/upload", { method: "POST", body: new FormData(form) });
                if (!upload.ok) throw new Error(`上传 HTTP ${upload.status}`);
                const { task_id } = await upload.json();
                while (true) {
                    const response = await fetch(`/status/${task_id}`);
                    if (!response.ok) throw new Error(`状态 HTTP ${response.status}`);
                    const { status, done_list } = await response.json();
                    result.textContent = [task_id, status, ...done_list].join("\n");
                    if (status === "completed" || status === "failed") break;
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
            } catch (error) {
                result.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
